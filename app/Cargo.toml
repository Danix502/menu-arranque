[package]
name = "menu-arranque"
version = "0.1.0"
edition = "2024"

[dependencies]
libm = "0.2"
uefi = { version = "0.41", features = ["alloc", "global_allocator", "panic_handler"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
panic = "abort"
